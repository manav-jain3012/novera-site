<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>ALB Masterverse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: navy sidebar with grouped tabs (client's reference CRM) + mist work area in ALB's royal-blue web style. One primary action per screen, big tap targets. */
:root{
  --bg:#f3f6ff; --surface:#ffffff; --surface-2:#f7f9ff; --line:#e6ebf5; --line-2:#d6def0;
  --ink:#0e1733; --body:#46506e; --muted:#737d9c;
  --royal:#3b5bdb; --royal-600:#2f49c0; --royal-50:#eef2ff; --royal-100:#dde6ff; --sky:#0ea5e9;
  --side:#0e1733; --side-2:#16203f; --side-ink:#c2cbe6; --side-muted:#7e89ab;
  --good:#12805c; --good-bg:#e3f6ee; --warn:#b4610b; --warn-bg:#fdf1de; --bad:#d23a4e; --bad-bg:#fde8eb;
  --violet:#6d4fd8; --violet-bg:#efeafe; --gold:#f6bd00;
  --shadow:0 1px 2px rgba(14,23,51,.05),0 8px 24px rgba(14,23,51,.06);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f24; --surface:#111a36; --surface-2:#16203f; --line:#232f55; --line-2:#2e3b66;
  --ink:#eef2ff; --body:#c2cbe6; --muted:#8e99bd;
  --royal:#6d8bff; --royal-600:#9bb2ff; --royal-50:#1a2550; --royal-100:#22306a; --sky:#38bdf8;
  --side:#070b1c; --side-2:#121a38; --side-ink:#c2cbe6; --side-muted:#6f7aa0;
  --good:#4fd1a1; --good-bg:#0f3328; --warn:#f2b45c; --warn-bg:#3a2810; --bad:#ff7a8c; --bad-bg:#3d1520;
  --violet:#b39ae8; --violet-bg:#2a2150; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f24; --surface:#111a36; --surface-2:#16203f; --line:#232f55; --line-2:#2e3b66;
  --ink:#eef2ff; --body:#c2cbe6; --muted:#8e99bd;
  --royal:#6d8bff; --royal-600:#9bb2ff; --royal-50:#1a2550; --royal-100:#22306a; --sky:#38bdf8;
  --side:#070b1c; --side-2:#121a38; --side-ink:#c2cbe6; --side-muted:#6f7aa0;
  --good:#4fd1a1; --good-bg:#0f3328; --warn:#f2b45c; --warn-bg:#3a2810; --bad:#ff7a8c; --bad-bg:#3d1520;
  --violet:#b39ae8; --violet-bg:#2a2150; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;height:100%}
/* ---------- sidebar */
.side{width:240px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand img{height:26px;width:auto}
.brand b{display:block;color:#fff;font-weight:700;font-size:14px;line-height:1.15}
.brand span{display:block;color:var(--side-muted);font-size:11.5px;font-weight:500}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r);color:var(--side-ink);text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(59,91,219,.32),rgba(59,91,219,.08));color:#fff}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(#6d8bff,#0ea5e9)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:#3b5bdb;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 2px;border-top:1px solid var(--side-2)}
.me .av{background:#2f49c0;color:#fff}
.me b{color:#fff;font-size:13px;display:block}
.me span{font-size:11.5px;color:var(--side-muted)}

/* ---------- main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:14px max(24px,env(safe-area-inset-right,0px)) 14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:13px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:min(340px,40vw);color:var(--muted)}
.search input{border:0;background:transparent;outline:0;width:100%;color:var(--ink)}
.search svg{width:16px;height:16px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--body);position:relative}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.menu{display:none}
.view{flex:1;overflow-y:auto;padding:22px max(24px,env(safe-area-inset-right,0px)) 40px 24px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ---------- atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;border:1px solid transparent;padding:9px 16px;font-weight:600;font-size:13.5px;white-space:nowrap;line-height:1.2}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--royal);color:#fff;box-shadow:0 6px 16px rgba(59,91,219,.28)}
.btn.primary:hover{background:var(--royal-600)}
:root[data-theme="dark"] .btn.primary{color:#0a0f24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0a0f24}}
.btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--royal);color:var(--royal)}
.btn.soft{background:var(--royal-50);color:var(--royal)}
.btn.wa{background:var(--good-bg);color:var(--good)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.lg{padding:12px 20px;font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-h h2{font-size:15px;font-weight:700}
.card-h .more{margin-left:auto;color:var(--royal);font-weight:600;font-size:13px;text-decoration:none;background:none;border:0}
.card-b{padding:14px 18px 18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--royal)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;background:var(--royal-100);color:var(--royal-600)}
.av.lg{width:52px;height:52px;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--body);border:1px solid var(--line)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.s-new{background:var(--royal-50);color:var(--royal);border-color:transparent}
.s-contacted{background:#e0f2fe;color:#0369a1;border-color:transparent}
.s-interested{background:var(--violet-bg);color:var(--violet);border-color:transparent}
.s-booked{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.s-done{background:#fef3c7;color:#92400e;border-color:transparent}
.s-followup{background:#fce7f3;color:#be185d;border-color:transparent}
.s-enrolled{background:var(--good-bg);color:var(--good);border-color:transparent}
.s-lost{background:var(--surface-2);color:var(--muted)}
:root[data-theme="dark"] .s-contacted{background:#0c2d44;color:#7dd3fc}
:root[data-theme="dark"] .s-done{background:#3a2c0c;color:#fcd34d}
:root[data-theme="dark"] .s-followup{background:#3d1530;color:#f9a8d4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .s-contacted{background:#0c2d44;color:#7dd3fc}:root:not([data-theme="light"]) .s-done{background:#3a2c0c;color:#fcd34d}:root:not([data-theme="light"]) .s-followup{background:#3d1530;color:#f9a8d4}}
.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- dashboard */
.hello{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello h2{font-size:26px;font-weight:800}
.hello p{margin:2px 0 0;color:var(--body)}
.hello .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--royal-100)}
.kpi .k{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .k span{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--royal-50);color:var(--royal)}
.kpi .k svg{width:16px;height:16px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .d{font-size:12.5px;color:var(--body)}
.kpi .d b{color:var(--good);font-weight:600}
.kpi .d b.bad{color:var(--bad);background:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;color:var(--body)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,23,51,.1)}
.tabs button em{font-style:normal;color:var(--muted);margin-left:4px}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .time{width:62px;flex:none;font-weight:700;font-size:13px}
.task .time small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.task .what b{display:block;font-weight:600;cursor:pointer}
.task .what b:hover{color:var(--royal)}
.task .what span{font-size:12.5px;color:var(--muted)}
.task .go{display:flex;gap:6px;flex:none}
.task.done{opacity:.5}
.task.done .what b{text-decoration:line-through}
.check{width:34px;height:34px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.check svg{width:16px;height:16px}
.check:hover,.task.done .check{background:var(--good);border-color:var(--good);color:#fff}
.pipe{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;margin:6px 0 14px}
.pipe i{display:block}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-weight:700}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--royal),var(--sky));border-radius:999px}

/* ---------- tables */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sel{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:500;font-size:13px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--royal-50)}
td.r,th.r{text-align:right}
.name b{display:block;font-weight:600}
.name span{font-size:12.5px;color:var(--muted)}

/* ---------- board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.col h3 em{font-style:normal;color:var(--muted);font-weight:600;margin-left:auto}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.lcard:hover{border-color:var(--royal)}
.lcard b{font-weight:600}
.lcard span{font-size:12px;color:var(--muted)}

/* ---------- lead page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--royal);font-weight:600;text-decoration:none;font-size:13px}
.back svg{width:16px;height:16px}
.lead-head{padding:20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.lead-head h2{font-size:22px;font-weight:800}
.lead-head .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--body);font-size:13px;margin-top:4px}
.lead-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stepper{display:flex;gap:4px;padding:0 20px 20px;overflow-x:auto}
.stepper button{flex:1;min-width:96px;border:0;padding:9px 6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border-radius:6px;position:relative;white-space:nowrap}
.stepper button.past{background:var(--royal-100);color:var(--royal-600)}
.stepper button.cur{background:var(--royal);color:#fff}
.stepper button.lost.cur{background:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.facts div span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.facts div b{font-weight:600}
.tl{display:flex;flex-direction:column}
.tl-i{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tl-i:first-child{border-top:0}
.tl-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.tl-ic svg{width:15px;height:15px}
.tl-i b{font-weight:600}
.tl-i p{margin:2px 0 0;color:var(--body);font-size:13px}
.tl-i time{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.composer{display:flex;flex-direction:column;gap:10px}
.composer textarea{width:100%;min-height:72px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface);resize:vertical}
.tpl{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- calendar */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.day.today{border-color:var(--royal);box-shadow:0 0 0 3px var(--royal-50)}
.day h3{font-size:13px;font-weight:700}
.day h3 span{display:block;font-size:22px;font-weight:800}
.demo{border-radius:8px;padding:8px 10px;background:var(--royal-50);border-left:3px solid var(--royal);text-align:left;border-top:0;border-right:0;border-bottom:0;display:flex;flex-direction:column;gap:2px;width:100%}
.demo b{font-size:13px;font-weight:600}
.demo span{font-size:12px;color:var(--body)}
.demo.done{background:var(--good-bg);border-left-color:var(--good)}

/* ---------- attendance */
.clock{display:flex;align-items:center;gap:20px;padding:22px;flex-wrap:wrap;background:linear-gradient(120deg,#0e1733,#21317d 60%,#2f49c0);color:#fff;border:0}
.clock .t{font-size:40px;font-weight:800;letter-spacing:-.02em}
.clock p{margin:0;color:#c2d2ff}
.clock .btn{margin-left:auto}
.clock .btn.primary{background:#fff;color:#0e1733;box-shadow:none}
.clock .btn.out{background:#ff6b81;color:#fff}

/* ---------- reports */
.chart{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.hbar .bar{height:12px}
.hbar b{text-align:right;font-weight:700}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel div{border-radius:8px;padding:9px 14px;color:#fff;font-weight:600;font-size:13px;display:flex;justify-content:space-between;margin:0 auto}

/* ---------- settings */
.stage-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.grip{color:var(--muted);cursor:grab}
.toggle{width:40px;height:22px;border-radius:999px;background:var(--line-2);position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--royal)}
.toggle.on::after{left:21px}

/* ---------- modal & toast */
.scrim{position:fixed;inset:0;background:rgba(10,15,36,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100% - 32px);overflow-y:auto;box-shadow:0 24px 60px rgba(10,15,36,.35)}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:17px;font-weight:800}
.modal-h .iconbtn{margin-left:auto;width:32px;height:32px}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12.5px;font-weight:600;color:var(--body)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface);outline:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--royal);box-shadow:0 0 0 3px var(--royal-50)}
.fld-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:12.5px}
.seg button.on{background:var(--royal);border-color:var(--royal);color:#fff}
.note{background:var(--royal-50);color:var(--royal-600);border-radius:10px;padding:10px 12px;font-size:13px}

function badgeEarned(b,n){const a=actual[n]||actual[ME],t=targets[n]||targets[ME];
  const v={enr:a.enr,rev:a.rev,cpd:a.calls/WD_DONE,talk:a.talk/60,tgt:a.rev/t.rev*100,ontime:n==='Karan Mehta'?2:6,show:n==='Riya Sharma'||n==='Neha Kapoor'?84:68}[b.met];

function vCalls(){
  const f=(CALLP.find(p=>p[0]===callPeriod)||CALLP[3])[2];
  const rows=REPS.map(r=>{const [o,i,m,t]=CALLBASE[r];const O=Math.max(1,Math.round(o*f)),In=Math.max(0,Math.round(i*f)),M=Math.round(m*f),T=t*f;const ans=Math.max(1,Math.round((O+In)*.78));return {r,O,In,M,T,ans,avg:T/ans}});
  const tot=rows.reduce((a,x)=>({O:a.O+x.O,In:a.In+x.In,M:a.M+x.M,T:a.T+x.T,ans:a.ans+x.ans}),{O:0,In:0,M:0,T:0,ans:0});
  const mx=Math.max(...rows.map(x=>x.T));
  const tic={out:['out','Outgoing'],in:['in','Incoming']};
  const label=(CALLP.find(p=>p[0]===callPeriod)||[])[1];
  return `<div class="wrap">
  <div class="card"><div class="filters"><div class="chips-row">${CALLP.map(([k,t])=>`<button class="pchip ${callPeriod===k?'on':''}" data-act="callP" data-k="${k}">${t}</button>`).join('')}</div>
   ${callPeriod==='custom'?`<div class="row" style="gap:8px"><input class="dinp" type="date" value="${callFrom}" data-ch="callFrom" aria-label="From"><span class="muted">to</span><input class="dinp" type="date" value="${callTo}" data-ch="callTo" aria-label="To"></div>`:''}</div></div>
  <div class="stats">${statCard('Total calls',tot.O+tot.In,`${tot.ans} answered`,'phone')}${statCard('Outgoing',tot.O,'by 4 counsellors','out','b')}${statCard('Incoming',tot.In,`<b style="color:var(--bad)">${tot.M} missed</b>`,'in','g')}${statCard('Total talk time',hm(tot.T/60),label,'clock')}${statCard('Average talk time',ms(tot.T/tot.ans),'per answered call','chart','b')}</div>
  <div class="card tbl-wrap"><div class="card-h" style="padding-bottom:12px"><h2>By salesperson</h2><span class="muted" style="margin-left:auto;font-size:12.5px">${label}</span></div><table><thead><tr><th>Salesperson</th><th class="r">Outgoing</th><th class="r">Incoming</th><th class="r hide-m">Missed</th><th class="r">Total talk time</th><th class="r">Average TT</th><th class="hide-m" style="width:22%">Share of talk time</th></tr></thead><tbody>
   ${rows.sort((a,b)=>b.T-a.T).map(x=>`<tr><td><div class="row"><div class="av">${ini(x.r)}</div><b style="font-weight:600">${x.r}</b></div></td><td class="r num">${x.O}</td><td class="r num">${x.In}</td><td class="r num hide-m">${x.M?`<span style="color:var(--bad)">${x.M}</span>`:'0'}</td><td class="r num"><b>${hm(x.T/60)}</b></td><td class="r num">${ms(x.avg)}</td><td class="hide-m"><div class="bar"><i style="width:${x.T/mx*100}%"></i></div></td></tr>`).join('')}
   <tr class="tot"><td><b>Team total</b></td><td class="r num"><b>${tot.O}</b></td><td class="r num"><b>${tot.In}</b></td><td class="r num hide-m"><b>${tot.M}</b></td><td class="r num"><b>${hm(tot.T/60)}</b></td><td class="r num"><b>${ms(tot.T/tot.ans)}</b></td><td class="hide-m"></td></tr></tbody></table></div>
  <div class="card tbl-wrap"><div class="card-h" style="padding-bottom:12px"><h2>Call log</h2><span class="muted" style="margin-left:auto;font-size:12.5px">Synced from the call-sync app on the team’s Android phones</span></div><table><thead><tr><th>Lead</th><th>Type</th><th class="hide-m">Salesperson</th><th>Talk time</th><th>Result</th><th class="hide-m">When</th></tr></thead><tbody>
    ${calls.map(([c,l,t,d,r,w])=>`<tr><td><b style="font-weight:600">${l}</b></td><td><span class="row" style="gap:6px;color:var(--body)">${ic(r==='Missed'?'miss':tic[t][0])}${r==='Missed'?'Missed':tic[t][1]}</span></td><td class="hide-m">${c.split(' ')[0]}</td><td class="num">${d}</td><td>${r==='Answered'?'<span class="chip ok">Answered</span>':r==='Missed'?'<span class="chip bad">Missed</span>':'<span class="chip">Not answered</span>'}</td><td class="hide-m muted">${w}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function onCh(e){
  const el=e.target.closest('[data-ch]'); if(!el) return; const k=el.dataset.ch, v=el.value;

    switch(k){case 'arName':ARULES[i].name=v;break;case 'acF':ARULES[i].conds[j].f=v;break;case 'acO':ARULES[i].conds[j].op=v;break;case 'acV':ARULES[i].conds[j].v=v;rr=true;break;case 'arTo':ARULES[i].to=v;break;
      case 'afRe':AFALL.reassign=+v;break;case 'afCap':AFALL.cap=+v;break;
      case 'ltF':{const c=LTYPES[i][0];if(f==='name')LTYPES[i][1]=v;else if(f==='days')LTYPES[i][2]=+v;else LPOL[c][f]=+v;rr=true;break}
      case 'prYear':PRULES.year=v;break;case 'prN':PRULES[f]=+v;rr=true;break;case 'prAppr':PRULES[f]=v;break;
      case 'bF':BADGES[i][f]=f==='val'?+v:v;if(f==='val')rr=true;break;
      case 'cuF':CURS[i][f]=f==='rate'?+v:v;if(f==='rate')rr=true;break;
      case 'fxRep':fxReport=v;break;case 'curDef':curView=v;break;}
    if(rr){const y=document.getElementById('view').scrollTop;setTimeout(()=>{rerender();document.getElementById('view').scrollTop=y},0)} return; }
  if(k==='rmPrev'){document.getElementById('rm-prev').textContent=v;return}
  if(k==='laCalc'){laFill();return}
  if(k==='aeCalc'){aeFill();return}
  if(k==='atOut'||k==='atEd'){if(e.type!=='change')return;if(k==='atOut')ATTR.autoOut=v;else ATTR.edits=Math.max(0,+v||0);return}
  if(k==='rv'){if(e.type==='input'){adv.rules[+el.dataset.i].v=v;rerender();const i=document.getElementById('rv-'+el.dataset.i);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}return}
  const typing=e.type==='input'&&(k==='payQ'||k==='invQ');
  if(e.type==='input'&&!typing&&k!=='giCalc') return;
  if(e.type==='change'&&(k==='payQ'||k==='invQ'||(k==='giCalc'&&el.tagName==='INPUT'))) return;
  switch(k){
    case 'col': visCols=el.checked?LCOLS.map(c=>c[0]).filter(c=>visCols.includes(c)||c===v):visCols.filter(c=>c!==v); if(!visCols.length) visCols=['name']; saveCols(); break;

    case 'callFrom': callFrom=v; break; case 'callTo': callTo=v; break;

    case 'invQ': invF.q=v; break; case 'invStatus': invF.status=v; break; case 'invType': invF.type=v; break; case 'invFrom': invF.from=v; break; case 'invTo': invF.to=v; break;

    case 'leadSort': adv.sort=v; break; case 'perfWho': perfWho=v; break; case 'attTo': attTo=v; break;
